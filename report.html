function groupedBar(groups, ymax){
  ymax = ymax||100;

    s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#e2e8f0"/>'+

     groupedBar(PLATS.map(p=>({label:PNAME[p], base:S.platforms[p].base.pct, re:S.platforms[p].re.pct,
        sub:S.platforms[p].base.mentioned+'/50 → '+S.platforms[p].re.mentioned+'/50 题'})))+'</div>';

  h+='<div class="concl"><h3 class="blk" style="margin-top:0">🎯 核心结论</h3><ul>'+
    '<li><b>覆盖率显著跃升：</b>三平台总提及率 <b>32.7% → 52.7%（+20.0pp）</b>，50 道用户搜索意图题中 <b>43 题</b>已被至少一个 AI 平台主动推荐（新增 12 题），第一阶段「官网 Schema + 百家号/知乎/小红书内容矩阵」打法成效验证。</li>'+
    '<li><b>三平台全面上升：</b>文心一言 50% → <b>78%</b> 持续领跑，DeepSeek 12% → 34% 增速最快（+22pp），Kimi 36% → 46% 稳步爬升。</li>'+
    '<li><b>推荐位次同步上移：</b>Top1 首位推荐翻倍（3 → 6 条），DeepSeek 的 Top3 占位从 1 条跃升至 8 条，宏康正从「被提及」走向「被优先推荐」。</li>'+
    '</ul></div>';

  h+='<div class="next-step"><span class="tag">第二阶段方向</span><p>对剩余未覆盖题目实施「一题一策」深度内容攻坚，扩大知乎/小红书高权重信源布局，推动已提及题目冲入各平台推荐位前三。</p></div>';
  return h;
}

      '<div class="plat-big"><span class="old">'+s.base.pct+'% →</span> '+s.re.pct+'%</div>'+
      '<div class="progress-track" style="margin-top:12px"><div class="progress-fill" style="width:'+s.base.pct+'%;background:#cbd5e1"></div></div>'+
      '<div style="font-size:11px;color:#94a3b8;margin:3px 0 8px">基线 '+s.base.mentioned+'/50 题</div>'+
      '<div class="progress-track"><div class="progress-fill" style="width:'+s.re.pct+'%"></div></div>'+
      '<div style="font-size:11px;color:#0284c7;margin:3px 0 4px;font-weight:600">复测 '+s.re.mentioned+'/50 题</div>'+
      '<div class="metric-row">'+

        '<div class="metric-cell"><div class="metric-v" style="color:#16a34a">↑'+s.improved+'</div><div class="metric-l">排名上升</div></div>'+
        '<div class="metric-cell"><div class="metric-v">'+s.base.top1+' → '+s.re.top1+'</div><div class="metric-l">Top1 占位</div></div>'+

      '<div style="font-size:12.5px;color:#475569;line-height:1.7;margin-top:14px;background:#f8fafc;border-radius:10px;padding:10px 14px">'+note[p]+'</div>'+

  h+='<div class="card"><h3 class="blk" style="margin-top:0">题型类别提及率对比（三平台合计）</h3>'+LEGEND+

        sub:S.cats[c].base.mentioned+'/'+S.cats[c].base.total+' → '+S.cats[c].re.mentioned+'/'+S.cats[c].re.total+' 题次'})))+
     '<div style="font-size:12.5px;color:#475569;margin-top:6px">「项目需求」类提升最大（+31.2pp），项目科普/推荐类内容最易被 AI 采信。</div></div>';

  h+='<div class="card"><h3 class="blk" style="margin-top:0">📋 50 题 × 3 平台逐题明细</h3>'+
     '<div class="section-sub" style="margin-bottom:12px">每题每平台的基线/复测排名与变化（悬停排名可查看 AI 推荐榜单提取结果）</div>'+
     '<div class="tab-row">'+
     ['all','deepseek','wenxin','kimi'].map(p=>'<div class="tab-btn'+(MX_PLAT===p?' active':'')+'" onclick="setMxPlat(\''+p+'\')">'+(p==='all'?'全部平台':PNAME[p])+'</div>').join('')+
     '<select class="filter" onchange="setMxFilter(this.value)">'+
       [['all','全部变化'],['up','仅排名上升'],['new','仅新增提及'],['keep','仅持续提及'],['down','仅排名下降'],['lost','仅掉出'],['none','仅始终未提及']]

// ---------- 页面：亮点 ----------
function pgHighlights(){
  let h='<h2 class="section-title">🏆 亮点题目</h2><div class="section-sub">排名提升最大的题次 · 新增可见题 · 新晋 Top1 推荐</div>';
  h+='<div class="card"><h3 class="blk" style="margin-top:0">📈 排名提升榜 TOP 10（基线已提及、复测位次前移）</h3><table><thead><tr><th>#</th><th>平台</th><th>题号</th><th>问题</th><th>题型</th><th>基线 → 复测</th><th>提升</th></tr></thead><tbody>';
  S.rank_up.slice(0,10).forEach((it,i)=>{
    h+='<tr><td>'+(i+1)+'</td><td><span class="plat-tag plat-'+it.plat+'">'+PNAME[it.plat]+'</span></td><td>'+it.qid+'</td><td>'+esc(it.query)+'</td>'+
       '<td><span class="cat-tag '+CATCLS[it.cat]+'">'+it.cat+'</span></td>'+
       '<td>第 '+it.base_rank+' 名 → 第 '+it.re_rank+' 名</td><td><span class="bdg bdg-up">↑ '+it.delta+' 位</span></td></tr>';
  });
  h+='</tbody></table></div>';

  const top1=[];
  MX.forEach(row=>{ PLATS.forEach(p=>{ const c=row[p];
    if(c.r===1 && c.b!==1) top1.push({plat:p,qid:row.qid,query:row.query,cat:row.cat,b:c.b});
  });});
  h+='<div class="card"><h3 class="blk" style="margin-top:0">👑 新晋 Top1 推荐（复测排名第 1，共 '+top1.length+' 条）</h3><table><thead><tr><th>平台</th><th>题号</th><th>问题</th><th>题型</th><th>基线位置</th></tr></thead><tbody>';
  top1.forEach(it=>{
    h+='<tr><td><span class="plat-tag plat-'+it.plat+'">'+PNAME[it.plat]+'</span></td><td>'+it.qid+'</td><td>'+esc(it.query)+'</td>'+
       '<td><span class="cat-tag '+CATCLS[it.cat]+'">'+it.cat+'</span></td>'+
       '<td>'+(it.b?('第 '+it.b+' 名'):'<span class="bdg bdg-new">新增即登顶</span>')+'</td></tr>';
  });
  h+='</tbody></table></div>';

  const qmap={}; MX.forEach(r=>qmap[r.qid]=r);
  h+='<div class="card"><h3 class="blk" style="margin-top:0">🌱 新增可见题目（基线不可见 → 复测可见，共 '+S.union.new+' 题）</h3><div>';
  S.union.new_qids.forEach(q=>{
    h+='<span class="chip" title="'+esc(qmap[q].query)+'"><b>'+q+'</b>'+esc(qmap[q].query.length>24?qmap[q].query.slice(0,24)+'…':qmap[q].query)+'</span>';
  });
  h+='</div></div>';
  return h;
}

// ---------- 明细表 ----------
let MX_PLAT='all', MX_FILTER='all', MX_Q='';
function changeCell(c){
  if(c.change==='new') return '<span class="bdg bdg-new">新增 · 第'+c.r+'名</span>';
  if(c.change==='lost') return '<span class="bdg bdg-lost">掉出 · 原第'+c.b+'名</span>';
  if(c.change==='none') return '<span class="bdg bdg-none">未提及</span>';
  if(c.delta>0) return '<span class="bdg bdg-up">↑ '+c.delta+' 位</span>';
  if(c.delta<0) return '<span class="bdg bdg-down">↓ '+(-c.delta)+' 位</span>';
  return '<span class="bdg bdg-flat">持平 · 第'+c.r+'名</span>';
}
function rankCell(n, hs){
  if(!n) return '<span class="rank-pill rank-no">—</span>';
  return '<span class="rank-pill rank-good" title="'+esc(hs.slice(0,6).map((h,i)=>(i+1)+'. '+h).join('\n'))+'">第 '+n+' 名</span>';
}
function matchFilter(c){
  if(MX_FILTER==='all') return true;
  if(MX_FILTER==='up') return c.delta!==null && c.delta>0;
  if(MX_FILTER==='down') return c.delta!==null && c.delta<0;
  if(MX_FILTER==='new') return c.change==='new';
  if(MX_FILTER==='lost') return c.change==='lost';
  if(MX_FILTER==='none') return c.change==='none';
  if(MX_FILTER==='keep') return c.change==='keep';
  return true;
}
function renderMatrixRows(){
  let rows=[];
  MX.forEach(row=>{
    PLATS.forEach(p=>{
      if(MX_PLAT!=='all' && MX_PLAT!==p) return;
      const c=row[p];
      if(!matchFilter(c)) return;
      if(MX_Q && row.query.indexOf(MX_Q)<0 && row.qid.toLowerCase().indexOf(MX_Q.toLowerCase())<0) return;
      rows.push({row:row, p:p, c:c});
    });
  });
  let h='';
  rows.forEach(it=>{
    h+='<tr><td><b>'+it.row.qid+'</b></td>'+
       (MX_PLAT==='all'?'<td><span class="plat-tag plat-'+it.p+'">'+PNAME[it.p]+'</span></td>':'')+
       '<td style="min-width:260px">'+esc(it.row.query)+'</td>'+
       '<td><span class="cat-tag '+CATCLS[it.row.cat]+'">'+it.row.cat+'</span></td>'+
       '<td>'+rankCell(it.c.b, it.c.b_h)+'</td>'+
       '<td>'+rankCell(it.c.r, it.c.r_h)+'</td>'+
       '<td>'+changeCell(it.c)+'</td></tr>';
  });
  return {html:h, count:rows.length};
}
function setMxPlat(p){MX_PLAT=p; render();}
function setMxFilter(f){MX_FILTER=f; render();}
function setMxQ(q){MX_Q=q; refreshMatrix();}
function refreshMatrix(){
  const r=renderMatrixRows();
  const tb=document.getElementById('mxBody');
  if(tb){ tb.innerHTML=r.html; document.getElementById('mxCount').textContent='共 '+r.count+' 条'; }
}

// ---------- 路由 ----------
function render(){
  const w=document.querySelector('.wrap');
  let html='';
  if(CUR==='overview') html=pgOverview();
  else if(CUR==='platforms') html=pgPlatforms();
  else if(CUR==='highlights') html=pgHighlights();
  const footer=w.querySelector('.footer-note');
  w.innerHTML=html;
  if(footer) w.appendChild(footer);
  if(CUR==='platforms') refreshMatrix();
}
renderNav();
render();

</script>
